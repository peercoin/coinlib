name: Build macOS

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve coinlib dependencies
        working-directory: coinlib
        run: dart pub get

      - name: Build Dart CLI release bundle
        working-directory: coinlib
        run: dart build cli --target example/coinlib_example.dart

      - name: Resolve Flutter example dependencies
        working-directory: coinlib_flutter/example
        run: flutter pub get

      - name: Build Flutter macOS release
        working-directory: coinlib_flutter/example
        run: flutter build macos --release --no-pub
