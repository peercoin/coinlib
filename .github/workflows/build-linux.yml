name: Build Linux

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Resolve coinlib dependencies
        working-directory: coinlib
        run: dart pub get

      - name: Build Dart CLI release bundle
        working-directory: coinlib
        run: dart build cli --target example/coinlib_example.dart --output build/coinlib_cli

      - name: Run Dart CLI release bundle
        working-directory: coinlib
        run: ./build/coinlib_cli/bundle/bin/coinlib_example

      - name: Resolve Flutter example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Flutter Linux release
        working-directory: example
        run: flutter build linux --release --no-pub
