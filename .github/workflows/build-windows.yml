name: Build Windows

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve coinlib dependencies
        working-directory: coinlib
        run: dart pub get

      - name: Build Dart CLI release bundle
        working-directory: coinlib
        run: dart build cli --target example/coinlib_example.dart --output build/coinlib_cli

      - name: Run Dart CLI release bundle
        working-directory: coinlib
        run: .\build\coinlib_cli\bundle\bin\coinlib_example.exe

      - name: Resolve Flutter example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Flutter Windows release
        working-directory: example
        run: flutter build windows --release --no-pub
