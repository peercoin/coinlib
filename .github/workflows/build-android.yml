name: Build Android

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Flutter Android release APK
        working-directory: example
        run: flutter build apk --release --no-pub
