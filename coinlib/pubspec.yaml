name: coinlib
description:
  A straight-forward, modular library for Peercoin and other Satoshi-based UTXO
  blockchains
version: 5.0.0
repository: https://github.com/peercoin/coinlib

environment:
  sdk: '>=3.13.0 <4.0.0'

dev_dependencies:
  ffigen: ^22.0.0
  lints: ^6.0.0
  test: ^1.21.0

dependencies:
  code_assets: ^2.0.0
  collection: ^1.17.1
  crypto: ^3.0.2
  dart_base_x: ^1.0.0
  ffi: ^2.1.0
  hex: ^0.2.0
  hooks: ^2.2.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.4
  pointycastle: ^4.0.0
  record_use: ^1.1.1
